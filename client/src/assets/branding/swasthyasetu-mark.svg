<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ss-teal-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="ss-emerald-grad" x1="12" y1="28" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f766e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ss-teal-grad)" filter="url(#ss-glow)" />

  <!-- Bridge Arch Pathway (Setu) -->
  <path
    d="M8 35 C16 23, 32 23, 40 35"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M10 37 C18 27, 30 27, 38 37"
    stroke="url(#ss-emerald-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Healthcare Medical Cross with Heartbeat Wave (Swasthya) -->
  <!-- Vertical Bar -->
  <rect x="21.5" y="10" width="5" height="18" rx="2.5" fill="#ffffff" />

  <!-- Horizontal Bar with Integrated ECG Pulse Rhythm -->
  <path
    d="M12 19 L19 19 L21.5 13 L24 24 L26.5 17 L29 19 L36 19"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Connected Pulse Node / Care Continuum Dot -->
  <circle cx="24" cy="31" r="2.5" fill="#ffffff" />
</svg>
